[package]
name = "tokenmaxing"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
http = "1"
prometheus = "0.14.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.11", features = [
    "server",
    "client",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "schemars",
] }
rquickjs = { version = "0.14.0", features = ["futures", "macro", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.12.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "time", "sync"] }
